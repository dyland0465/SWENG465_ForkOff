$kind: http-request
method: PATCH
url: '{{base_url}}/api/restaurants/:id/menu'
order: 5000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "menu": {
        "categories": [
          {
            "name": "Appetizers",
            "items": [
              {
                "id": 101,
                "name": "Crispy Calamari",
                "description": "Served with garlic lemon aioli",
                "price": 12.50
              }
            ]
          }
        ]
      }
    }
